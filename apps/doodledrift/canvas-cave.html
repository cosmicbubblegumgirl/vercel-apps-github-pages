<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DoodleDrift | Canvas Cave</title>
  <link rel="icon" href="assets/doodledrift-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="github-pages-api.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-page="canvas">
  <header class="topbar">
    <div class="nav-inner">
      <a class="brand" href="index.html"><img class="brand-logo" src="assets/doodledrift-logo.svg" alt="DoodleDrift"></a>
      <nav class="nav-links" aria-label="Primary">
        <a data-nav="home" href="index.html">Doodle Feed</a>
        <a data-nav="canvas" href="canvas-cave.html">Canvas Cave</a>
        <a data-nav="music" href="echo-forest.html">Echo Forest</a>
        <a data-nav="blog" href="blog-burrow.html">Blog Burrow</a>
        <a data-nav="mood" href="mood-meadow.html">Mood Meadow</a>
        <a data-nav="prompts" href="prompt-potion.html">Prompt Potion</a>
        <a data-nav="clips" href="clips.html">Cloud Clips</a>
      </nav>
      <div id="accountActions" class="account-actions"><button class="theme-toggle" type="button" data-theme-toggle>Dark</button></div>
    </div>
  </header>

  <main class="page-shell">
    <section class="page-head">
      <div>
        <p class="eyebrow">Canvas Cave</p>
        <h1>Draw the feeling before you explain it.</h1>
        <p class="lede">Use mood colors, soft prompts, and a simple cave canvas to make a public Canvas Doodle.</p>
      </div>
      <a class="button secondary" href="prompt-potion.html">Open Prompt Potion</a>
    </section>

    <section class="canvas-layout">
      <div class="canvas-wrap">
        <canvas id="paintCanvas" aria-label="Canvas Cave drawing surface"></canvas>
        <div class="tool-row">
          <button class="swatch active" type="button" data-swatch="#7DBFA2" title="Sage"></button>
          <button class="swatch" type="button" data-swatch="#8CB9D9" title="Moon blue"></button>
          <button class="swatch" type="button" data-swatch="#D9D0F0" title="Lavender"></button>
          <button class="swatch" type="button" data-swatch="#E6DC8F" title="Butterlight"></button>
          <button class="swatch" type="button" data-swatch="#28433C" title="Deep moss"></button>
          <label class="range-inline">Brush <input id="brushSize" type="range" min="2" max="34" value="10"><span id="brushValue">10</span></label>
          <button id="clearCanvas" class="button secondary" type="button">Clear</button>
        </div>
      </div>

      <aside class="panel">
        <h2>Drawing Prompts</h2>
        <div class="prompt-stack">
          <button class="chip" type="button" data-art-prompt="Draw your weather today.">Draw your weather today.</button>
          <button class="chip" type="button" data-art-prompt="Create a creature that protects your peace.">Create a creature that protects your peace.</button>
          <button class="chip" type="button" data-art-prompt="Paint a door to somewhere safe.">Paint a door to somewhere safe.</button>
          <button class="chip" type="button" data-art-prompt="Use three colors to show your current mood.">Use three colors to show your current mood.</button>
        </div>
        <form id="artDoodleForm" class="form-grid">
          <label>Title
            <input name="title" placeholder="Lantern sketch" required>
          </label>
          <label>Prompt
            <input id="artPrompt" name="prompt" placeholder="Choose or write one">
          </label>
          <label>Caption
            <textarea name="body" placeholder="What did this image help you hold?" required></textarea>
          </label>
          <div class="form-grid two">
            <label>Mood
              <input name="mood" placeholder="Quiet">
            </label>
            <label>Tags
              <input name="tags" placeholder="canvas, calm">
            </label>
          </div>
          <button class="button" type="submit">Share Canvas Doodle</button>
        </form>
      </aside>
    </section>
  </main>

  <footer class="footer"><strong>A quantum cupcake creation</strong></footer>
</body>
</html>
