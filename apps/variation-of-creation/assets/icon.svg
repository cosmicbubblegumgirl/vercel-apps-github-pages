<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Variation of Creation icon</title>
  <desc id="desc">A whimsical browser icon with a tilted art tile, smiling creation swirl, and bright star.</desc>
  <defs>
    <linearGradient id="tile" x1="36" y1="28" x2="221" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8e8"/>
      <stop offset=".52" stop-color="#effaf6"/>
      <stop offset="1" stop-color="#f8ecff"/>
    </linearGradient>
    <linearGradient id="swirl" x1="64" y1="61" x2="180" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08a79b"/>
      <stop offset=".45" stop-color="#ff7548"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="#101515"/>
  <g transform="rotate(-6 128 128)">
    <rect x="32" y="30" width="192" height="194" rx="42" fill="url(#tile)"/>
    <rect x="32" y="30" width="192" height="194" rx="42" fill="none" stroke="#101515" stroke-width="12"/>

