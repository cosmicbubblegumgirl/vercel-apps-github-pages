    <circle cx="128" cy="139" r="36" fill="#fff8e8" stroke="#101515" stroke-width="10"/>
    <circle cx="116" cy="130" r="5" fill="#101515"/>
    <circle cx="140" cy="130" r="5" fill="#101515"/>
    <path d="M114 147c8 10 22 10 30 0" fill="none" stroke="#101515" stroke-width="7" stroke-linecap="round"/>

    <path d="M175 53 186 74 209 78 192 94 196 117 175 106 154 117 158 94 141 78 164 74Z" fill="#ffd33d" stroke="#101515" stroke-width="7" stroke-linejoin="round"/>
    <path d="M65 80c18-12 41-16 67-12" fill="none" stroke="#ff7548" stroke-width="9" stroke-linecap="round"/>
    <path d="M58 190c31-8 59-5 84 10 20 11 38 11 56 0" fill="none" stroke="#08a79b" stroke-width="9" stroke-linecap="round"/>
  </g>
