<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" role="img" aria-labelledby="title desc">
  <title id="title">Quirkboards logo</title>
  <desc id="desc">A quirky layered board icon with a bright Quirkboards wordmark.</desc>
  <defs>
    <linearGradient id="tile" x1="18" y1="18" x2="156" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21d7c4"/>
      <stop offset="0.45" stop-color="#f8d84a"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="word" x1="186" y1="48" x2="732" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="0.38" stop-color="#21d7c4"/>
      <stop offset="0.68" stop-color="#f8d84a"/>
      <stop offset="1" stop-color="#ff8cc6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#21d7c4" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="8" y="8" width="160" height="160" rx="38" fill="#090b12"/>
    <g transform="rotate(-7 88 88)">
      <rect x="35" y="32" width="100" height="108" rx="20" fill="#f5f7ff" opacity="0.96"/>
      <rect x="50" y="22" width="92" height="112" rx="20" fill="url(#tile)"/>
      <rect x="50" y="22" width="92" height="112" rx="20" fill="none" stroke="#090b12" stroke-width="8"/>
      <path d="M73 55h46M73 78h29M73 101h38" fill="none" stroke="#090b12" stroke-width="8" stroke-linecap="round"/>
      <path d="M120 36l5 11 12 4-12 5-5 11-5-11-12-5 12-4 5-11Z" fill="#f5f7ff" stroke="#090b12" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="66" cy="117" r="9" fill="#090b12"/>
    </g>
  </g>
  <text x="194" y="88" fill="url(#word)" font-family="Trebuchet MS, Inter, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="0">Quirkboards</text>
  <text x="198" y="128" fill="#aab4c8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850" letter-spacing="0">DESIGN SERIOUS THINGS, STAY DELIGHTFULLY ODD</text>
  <path d="M622 122c26-20 51 18 80-2 18-12 29-4 45-14" fill="none" stroke="#21d7c4" stroke-width="8" stroke-linecap="round"/>
</svg>
