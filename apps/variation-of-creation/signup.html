<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | Variation of Creation</title>
  <meta name="description" content="Create a browser-local Variation of Creation account for saved art, logos, tattoos, and comic recipes.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="db.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-page="signup">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Variation of Creation home">
      <img src="assets/logo.svg" alt="Variation of Creation">
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-nav="studio">Studio</a>
      <a href="logos.html" data-nav="logos">Logos</a>
      <a href="tattoos.html" data-nav="tattoos">Tattoos</a>
      <a href="comics.html" data-nav="comics">Comics</a>
      <a href="upload.html" data-nav="upload">Upload</a>
      <a href="gallery.html" data-nav="gallery">Gallery</a>
    </nav>
    <div class="header-actions">
      <a class="auth-link active" href="login.html">Login</a>
      <button class="theme-switch" type="button" data-theme-toggle>Dark</button>
    </div>
  </header>

  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">Studio Sign Up</p>
      <h1>Create your local studio.</h1>
      <p class="lede">Your account and saved art live in this browser, which keeps the GitHub Pages version fast and private.</p>
      <form class="auth-form" data-auth-form="signup">
        <label>Name
          <input name="name" type="text" autocomplete="name" required>
        </label>
        <label>Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="button primary" type="submit">Create Account</button>
      </form>
      <p id="authMessage" class="auth-message" aria-live="polite"></p>
      <a class="auth-alt" href="login.html">Already have an account? Login</a>
    </section>
  </main>

  <footer class="site-footer"><strong>a quantum cupcake creation</strong></footer>
</body>
</html>
